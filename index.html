
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Team Members</h1>

    <div class="container">
        <div class="card">
            <img src="https://i.pravatar.cc/150?img=12" alt="Profile">
            <h2>Amit Kumar</h2>
            <p>Frontend Developer who loves creating modern websites.</p>

            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
            </div>

            <button onclick="showProfile('amit')">View Profile</button>
            <p class="info" id="amit"></p>
        </div>

        <div class="card">
            <img src="https://i.pravatar.cc/150?img=47" alt="Profile">
            <h2>Rahul Sharma</h2>
            <p>UI/UX Designer interested in creative designs.</p>

            <div class="skills">
                <span>Figma</span>
                <span>Canva</span>
                <span>UI Design</span>
            </div>

            <button onclick="showProfile('rahul')">View Profile</button>
            <p class="info" id="rahul"></p>
        </div>

        <div class="card">
            <img src="https://i.pravatar.cc/150?img=33" alt="Profile">
            <h2>Priya Singh</h2>
            <p>Web Developer interested in learning new technologies.</p>

            <div class="skills">
                <span>HTML</span>
                <span>PHP</span>
                <span>MySQL</span>
            </div>

            <button onclick="showProfile('saloni')">View Profile</button>
            <p class="info" id="saloni"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
